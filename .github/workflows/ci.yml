name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (with TensorFlow)
        run: pip install -e ".[dev,tf]"
      - name: Run tests
        run: pytest -q
      - name: Smoke-run the CLI on synthetic data
        run: python -m anomaly_detection synthetic --seeds 1 --epochs 5 --out /tmp/results
